name: Build & Deploy (Pages + Android APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    name: Build web (dist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  pages:
    name: Deploy GitHub Pages
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK (preinstalled on runner)
        run: echo "ANDROID_HOME=$ANDROID_HOME"; ls "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platforms"
      - run: npx cap sync android
      - name: assembleDebug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Read version
        run: echo "VER=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - name: Collect APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk HarkCraft.apk
          ls -l HarkCraft.apk
          "$ANDROID_HOME"/build-tools/*/aapt dump badging HarkCraft.apk | head -20 || true
      - uses: actions/upload-artifact@v4
        with:
          name: HarkCraft-apk
          path: HarkCraft.apk
      - name: Publish Release v${{ env.VER }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: HARK CRAFT v${{ env.VER }}
          body: |
            HARK CRAFT 安卓版 v${{ env.VER }}（可直接侧载安装）。
            ⚠ 从 v1.0.0 升级：v1.0.0 使用了 CI 随机调试签名，请先卸载旧版再安装；从 v1.1.0 起使用固定签名，以后可直接覆盖升级。
            新内容：基岩版触屏布局（摇杆 / 跳跃 / 潜行 / 飞行 / 点击交互）、修复快捷栏点按切换、
            创造物品栏（38 种方块，4 个分类）、程序化 PBR 材质包（高清 256x / 128x / 64x / 像素 16x）、
            方块光照（荧石 / 灯笼 / 海晶灯照亮夜晚）、PCSS 软阴影、云层、天空环境反射、日出湿润高光、晨雾、SMAA/FXAA。
            下载 HarkCraft.apk，在手机上允许"安装未知来源应用"后安装即可。
          files: HarkCraft.apk
          make_latest: true
